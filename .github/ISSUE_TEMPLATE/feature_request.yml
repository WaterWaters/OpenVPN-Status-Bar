name: 功能建议
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 你遇到了什么痛点 / 想要什么
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望怎么实现
  - type: textarea
    id: alt
    attributes:
      label: 备选方案
      description: 其它可行做法
