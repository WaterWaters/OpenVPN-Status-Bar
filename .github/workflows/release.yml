name: Release

# 推 v* tag 即发版：构建内置引擎 → 单测 → 打包 DMG → 校验版本/签名 → 创建 Release。
# 版本号唯一来源是 tag；build.sh 的默认 VERSION 与 CHANGELOG 段落必须一致，否则这里直接失败。
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布
    # macOS runner 为 arm64（macos-latest），与 build-openvpn.sh 的按主机架构编译一致。
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 校验 tag / CHANGELOG / 分支
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "❌ tag 必须是 vX.Y.Z，实际为 $GITHUB_REF_NAME"; exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          grep -q "^## \[$VERSION\]" CHANGELOG.md || {
            echo "❌ CHANGELOG.md 缺少 [3.Y.Z] 段：## [$VERSION]"; exit 1
          }
          grep -q "${VERSION}" README.md || echo "⚠️ README 未提到 $VERSION（建议同步下载文件名）"

          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "❌ tag 不在 main 上，拒绝从分支发版"; exit 1
          }
          echo "✅ 版本 $VERSION 校验通过"

      - name: Swift 版本
        run: swift --version

      - name: 构建内置 openvpn 引擎
        run: ./build-openvpn.sh

      - name: 单元测试
        run: swift test --package-path . --scratch-path .build

      - name: 打包 .app + DMG
        run: VERSION="$VERSION" ./build.sh

      - name: 校验产物
        run: |
          APP="VPNStatusBar.app"
          test -x "$APP/Contents/MacOS/VPNStatusBar" || { echo "❌ 可执行文件缺失"; exit 1; }
          test -x "$APP/Contents/Resources/openvpn" || { echo "❌ 内置引擎缺失"; exit 1; }
          test -x "$APP/Contents/Resources/vpn-run.sh" || { echo "❌ 启动包装脚本缺失"; exit 1; }

          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          test "$V" = "$VERSION" || { echo "❌ Info.plist 版本 $V ≠ $VERSION"; exit 1; }

          DMG="dist/VPNStatusBar-$VERSION.dmg"
          test -f "$DMG" || { echo "❌ DMG 未生成: $DMG"; exit 1; }
          hdiutil verify "$DMG"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "✅ 产物校验通过（$(du -h "$DMG" | cut -f1)）"

      - name: 生成校验和
        run: |
          cd dist
          shasum -a 256 "VPNStatusBar-$VERSION.dmg" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 生成 Release 说明
        run: |
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          # 去掉段首空行
          sed -i '' '/./,$!d' release-notes.md
          test -s release-notes.md || { echo "❌ 未能从 CHANGELOG 提取说明"; exit 1; }
          {
            cat release-notes.md
            echo ""
            echo "## 安装"
            echo ""
            echo "1. 下载 \`VPNStatusBar-$VERSION.dmg\`（Apple 芯片 arm64）"
            echo "2. 打开并把 \`VPNStatusBar.app\` 拖进「应用程序」"
            echo "3. 首次打开若提示“无法验证开发者”：右键 → 打开"
            echo ""
            echo "校验下载：\`shasum -a 256 -c SHA256SUMS.txt\`"
            echo ""
            echo "详细说明见 [README](https://github.com/${GITHUB_REPOSITORY}#readme)。"
          } > release-notes-final.md
          cat release-notes-final.md

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "dist/VPNStatusBar-$VERSION.dmg" \
            "dist/SHA256SUMS.txt" \
            --title "v$VERSION" \
            --notes-file release-notes-final.md
