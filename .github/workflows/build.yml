name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Swift 版本
        run: swift --version

      - name: 运行单元测试
        run: swift test --package-path . --scratch-path .build

  build:
    name: 编译 (release)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Swift 版本
        run: swift --version

      - name: 编译 release
        run: swift build -c release --package-path . --scratch-path .build

      - name: 校验产物
        run: |
          BIN=".build/release/VPNStatusBar"
          test -x "$BIN" || { echo "❌ 产物缺失: $BIN"; exit 1; }
          echo "✅ 编译成功"
          file "$BIN"

      - name: 上传二进制产物
        uses: actions/upload-artifact@v4
        with:
          name: VPNStatusBar-bin
          path: .build/release/VPNStatusBar
          if-no-files-found: error
